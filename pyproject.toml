[project]
name = "airframe-designer"
version = "0.1.0"
description = "PX4-in-the-loop aircraft design simulator: wings, ducted fans, jetfoils, legs, CG - real time with a remote, or headless in batch for automated optimisation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pymavlink>=2.4.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "pyserial>=3.5",
]

[project.optional-dependencies]
cad = ["cadquery-ocp>=7.7"]          # STEP import (OpenCascade): bodies -> masses, CG, inertia
dev = ["pytest>=8", "cadquery-ocp>=7.7"]

[project.scripts]
airframe-designer = "airframe_designer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airframe_designer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["px4: needs a built PX4 SITL (skipped when ~/PX4-Autopilot/build/px4_sitl_default is missing)"]
