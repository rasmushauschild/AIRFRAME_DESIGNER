module_name: atlas_nose_lift
parameters:
- group: ATLAS Nose Lift
  definitions:
    NLF_MANUAL:
      description:
        short: SITL/HITL-only GPS-free RC development mode
        long: RC attitude with a 2 m relative altitude target and pilot throttle ceiling. Requires valid vertical estimates. No horizontal position hold or automatic landing. Hardware requires SYS_HITL=1 and active HIL state; real-flight mode is rejected. Stop and restart module to select mode. Normal arming checks remain enabled.
      type: int32
      default: 0
      min: 0
      max: 1
    NLF_M_HOV:
      description:
        short: Manual HITL altitude hold hover thrust
        long: Normalized collective feedforward after quadratic motor compensation. The current ATLAS model requires approximately 0.35. Validate again after propulsion or mass changes. Simulation-only mode.
      type: float
      default: 0.35
      min: 0.1
      max: 0.7
    NLF_RC_THR:
      description:
        short: Two-stage takeoff with physical RC throttle
        long: Start with calibrated physical RC throttle low. Raise it to permit nose-lift power. Press takeoff again after pitch settles to climb to 1 m. Holding throttle below 5 percent for 0.4 seconds requests controlled lowering or landing. RC loss requests abort. Kill and attitude-stick takeover remain available. Requires bench and flight validation.
      type: int32
      default: 0
      min: 0
      max: 1
    NLF_PILOT:
      description:
        short: Hand the aircraft to the pilot after the nose lift
        long: 0 = PX4 position hold climbs and hovers (needs a position estimate). 1 = after the nose is up and a second takeoff press, PX4 goes to Stabilized and the pilot's throttle lifts the aircraft; 2 = the same with Altitude mode. No GPS needed. The front-fan floor stays under the nose while the feet may touch and returns under a throttle cut; a stalled descent at low throttle lowers the nose and disarms. Requires the remote with throttle at minimum, COM_DISARM_LAND and COM_DISARM_PRFLT at 90 s or more.
      type: enum
      values:
        0: Position hold (GPS)
        1: Pilot, Stabilized
        2: Pilot, Altitude mode
      default: 0
    NLF_LMAX:
      description:
        short: Pilot handover lift fraction at full throttle
        long: Thrust over weight the module commands at full stick while it flies the ground phases of the pilot handover (centre stick = 1, hover).
      type: float
      default: 1.4
      min: 1.05
      max: 2
    NLF_UF:
      description:
        short: Front fan hover thrust utilisation
        long: Exported from the model. Thrust fraction of each front fan in the zero-torque hover.
      type: float
      default: 0
    NLF_U1:
      description:
        short: Motor 1 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 1 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_U2:
      description:
        short: Motor 2 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 2 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_U3:
      description:
        short: Motor 3 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 3 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_U4:
      description:
        short: Motor 4 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 4 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_U5:
      description:
        short: Motor 5 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 5 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_U6:
      description:
        short: Motor 6 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 6 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_U7:
      description:
        short: Motor 7 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 7 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_U8:
      description:
        short: Motor 8 hover thrust utilisation
        long: Exported from the model. Thrust fraction of motor 8 in the zero-torque hover; the pilot handover scales all rear motors with the throttle along this pattern.
      type: float
      default: 0
    NLF_ENABLE:
      description:
        short: Enable experimental SITL nose lift
      type: int32
      default: 0
      min: 0
      max: 1
    NLF_TARGET:
      description:
        short: Nose lift target structural pitch
        long: Ground sequence target only. Hover frame follows SENS_BOARD_Y_OFF. Experimental SITL setting; revalidate takeoff after changes.
      type: float
      unit: deg
      default: 25
    NLF_LAND_ANG:
      description:
        short: Landed structural pitch target
        long: Nose lowering target in degrees. Must be compatible with the measured resting posture of the fixed landing legs. Ground contact is required before shutdown.
      type: float
      unit: deg
      default: -13
    NLF_RATE:
      description:
        short: Pitch ramp rate
      type: float
      default: 5
      min: 1
      max: 15
    NLF_RAMP:
      description:
        short: Ground thrust ramp duration
      type: float
      default: 1.5
      min: 1
      max: 10
    NLF_DWELL:
      description:
        short: Settled attitude dwell duration
      type: float
      default: 1
      min: 0.5
      max: 5
    NLF_ALT:
      description:
        short: Takeoff altitude above starting position
      type: float
      default: 1
      min: 0.5
      max: 5
    NLF_TIMEOUT:
      description:
        short: Ground rotation timeout
      type: float
      default: 25
      min: 10
      max: 60
    NLF_LAND_V:
      description:
        short: Landing descent speed
      type: float
      default: 0.1
      min: 0.05
      max: 0.3
    NLF_DOWN_R:
      description:
        short: Nose lowering rate
      type: float
      default: 3
      min: 1
      max: 5
    NLF_RC_CH:
      description:
        short: RC channel of the takeoff button
        long: 0 = none. A momentary button on this channel requests the ground sequence (nose lift, climb, hover) when it is pressed (channel goes high).
      type: int32
      min: 0
      max: 18
      default: 0
    NLF_RC_LAND:
      description:
        short: RC channel of the landing button
        long: 0 = none. A momentary button on this channel requests the landing sequence (rear legs, nose down, motors off) when it is pressed while hovering.
      type: int32
      min: 0
      max: 18
      default: 0
    NLF_SPOOL_CMD:
      description:
        short: Rear motor command during the handover
        long: Experimental, 0 = off. While PX4 takes over on the ground, the rear motors are floored at this command (0..1, ramped up over NLF_SPOOL_T) so the rear feet leave the ground quickly. In simulation it pitched the nose past the attitude envelope; left off.
      type: float
      min: 0
      max: 1
      default: 0
    NLF_SPOOL_T:
      description:
        short: Rear motor ramp time during the handover
      type: float
      unit: s
      min: 0.2
      max: 3
      default: 0.8
    NLF_HW_OK:
      description:
        short: Allow the experimental ground sequence on real hardware
        long: SITL ignores this. On a flight controller the module refuses to start unless it is 1. Set it by hand once you accept flying the experimental sequence.
      type: int32
      default: 0
    NLF_CFG_OK:
      description:
        short: Ground geometry supported by exporter
      type: int32
      default: 0
    NLF_MASS:
      description:
        short: Aircraft mass from current model
      type: float
      default: 0
    NLF_GX:
      description:
        short: CG forward of rear contact pivot
      type: float
      default: 0
    NLF_GZ:
      description:
        short: CG below rear contact pivot
      type: float
      default: 0
    NLF_MOM:
      description:
        short: Yaw-balanced front pair pitch authority
      type: float
      default: 0
    NLF_W9:
      description:
        short: Yaw-balanced motor 9 thrust weight
      type: float
      default: 1
